<div class="layout">
  @if (!events.connected()) {
    <div class="connection-lost" data-testid="connection-lost">Disconnected from the daemon — reconnecting…</div>
  }
  <aside class="sidebar">
    <of-session-list (selected)="selectedId.set($event)" />
  </aside>
  <main class="workspace">
    @if (selectedId(); as id) {
      <of-terminal [sessionId]="id" />
    }
  </main>
  <aside class="inbox">
    <of-inbox />
  </aside>
</div>
