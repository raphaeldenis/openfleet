name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Rust job timer
        run: echo "RUST_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustc +1.88.0 --version
          cargo +1.99.0 clippy --version
      - name: Restore Cargo dependencies and build outputs
        id: cargo-cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.88.0-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-1.88.0-
      - name: Test Tauri library with the declared minimum Rust version
        run: cargo +1.88.0 test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Lint all Tauri targets with pinned Clippy
        run: sh scripts/cargo-clippy.sh cargo +1.99.0 clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Log additional macOS runner time
        if: always()
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          rust_job_seconds=$(($(date +%s) - RUST_JOB_STARTED_AT))
          rust_job_minutes=$(awk -v seconds="$rust_job_seconds" 'BEGIN { printf "%.2f", seconds / 60 }')
          echo "Rust job adds ${rust_job_seconds}s (${rust_job_minutes} macOS runner minutes); cache hit: ${CARGO_CACHE_HIT:-false}"
          echo "Rust job: ${rust_job_seconds}s (${rust_job_minutes} additional macOS runner minutes), cache hit: ${CARGO_CACHE_HIT:-false}. Excludes checkout and post-job cache upload; see the Actions job duration for the total." >> "$GITHUB_STEP_SUMMARY"
      - name: Save Cargo dependencies and build outputs
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm arch
      - run: pnpm typecheck
      - run: pnpm --filter @openfleet/desktop build
      - run: pnpm test
      - run: pnpm --filter @openfleet/desktop test

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openfleet/desktop exec playwright install --with-deps chromium
      - run: pnpm e2e
